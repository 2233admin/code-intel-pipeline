# Original ast-grep security rules for Go, authored for
# code-intel-pipeline. See python.yaml for the provenance note; this
# file follows the same "reimplement, not vendor" boundary.
#
# `pattern: {context, selector}` is used throughout instead of a bare
# `pattern:` string: Go's grammar cannot tell `pkg.Name(x)` apart from
# a type conversion without surrounding context, so a bare pattern
# with a capitalized method (Command/Query/Sum/HTML) silently matches
# nothing. Wrapping each pattern in a `x := ...` assignment and
# selecting `call_expression` resolves the ambiguity; verified against
# fixtures before landing.
id: cip-go-command-injection
language: go
severity: warning
message: >-
  exec.Command() built from string concatenation is a
  command-injection surface; pass argv elements as separate arguments
metadata: {cwe: "CWE-78", category: "injection"}
rule:
  any:
    - pattern:
        context: "x := exec.Command($A + $B, $$$REST)"
        selector: call_expression
    - pattern:
        context: "x := exec.Command($A + $B)"
        selector: call_expression
---
id: cip-go-sql-string-building
language: go
severity: warning
message: >-
  a Query/Exec call built from string concatenation is a
  SQL-injection surface; use parameterized placeholders instead
metadata: {cwe: "CWE-89", category: "injection"}
rule:
  any:
    - pattern:
        context: "x := $DB.$M($A + $B, $$$REST)"
        selector: call_expression
    - pattern:
        context: "x := $DB.$M($A + $B)"
        selector: call_expression
  has:
    field: function
    has: {field: field, regex: '^(Query|QueryRow|Exec)(Context)?$'}
---
id: cip-go-weak-hash
language: go
severity: info
message: >-
  MD5/SHA1 are not collision-resistant; do not use them for passwords,
  tokens, or integrity checks
metadata: {cwe: "CWE-327", category: "crypto"}
rule:
  any:
    - pattern:
        context: "x := md5.Sum($$$ARGS)"
        selector: call_expression
    - pattern:
        context: "x := sha1.Sum($$$ARGS)"
        selector: call_expression
---
id: cip-go-unsafe-template-html
language: go
severity: warning
message: >-
  converting a value to template.HTML bypasses html/template's
  auto-escaping; only wrap trusted, already-sanitized markup
metadata: {cwe: "CWE-79", category: "xss"}
rule:
  pattern:
    context: "x := template.HTML($ARG)"
    selector: call_expression
---
id: cip-go-hardcoded-credential
language: go
severity: warning
message: >-
  a credential-named variable is assigned a non-trivial string literal
  instead of being read from config/secret storage
metadata: {cwe: "CWE-798", category: "secrets"}
rule:
  kind: short_var_declaration
  all:
    - has: {field: left, regex: '(?i)^(password|secret|apikey|token)$'}
    - has:
        field: right
        has: {kind: interpreted_string_literal, regex: '^.{12,}$'}
