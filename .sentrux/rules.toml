# Code Intel Pipeline self-governance rules.
#
# Engine: built-in sentrux-native (code-intel sentrux --operation check).
# The absolute thresholds below are a ratchet snapshotted from the measured
# state of this tree under sentrux-native 2.0.0 (2026-07-25). They stop new
# regressions; tightening them back toward the original intent (max_cc 70,
# no god files, coupling grade B) is tracked modernization debt
# (issue #14, "Remaining tracked debt").
#
# Coupling denominator change (sentrux-native 2.1.0, 2026-07-31):
# `coupling_score` now divides import edges by the count of files written in a
# language whose dependency syntax the scanner models, not by every code file.
# The engine reads `import`/`from`/`use`/`mod`/`require(`/`#include`/`using`;
# PowerShell declares dependencies by dot-sourcing and `Import-Module` and so
# contributed ~0 import edges from 96 of this tree's 239 files. The old score
# therefore tracked the PowerShell share of the tree: it fell when PowerShell
# grew and rose when PowerShell shrank. Under the PS1 retirement campaign
# (#78) that inverted the gate — PR #80 deleted one PowerShell test, added the
# Rust test that replaced it, improved quality_signal by 60, and still failed
# `coupling_increased` 45.64 -> 45.73. Every remaining call point would have
# failed the same way, so the gate was measuring the campaign, not regression.
#
# The rescale is a change of population, not of intent: a tree with none of the
# unmodelled languages scores identically under both formulas. This tree's
# honest coupling is 74.41 (1064 import edges over 143 modelled files), which
# the old formula had been diluting to 45.48.
#
# max_coupling therefore moves from the inherited A..D letter ladder to an
# absolute number on the same scale. The ladder tops out at D = 6 imports per
# file, which no idiomatic Rust tree stays under, so keeping "D" would have
# meant a permanently red rule — the same failure mode the B/70/no-god
# thresholds had. 76.0 is a ratchet snapshotted from the measured 74.41;
# tightening it is tracked with the other threshold debt in issue #14.
# `.sentrux/baseline.json` was re-saved in this same commit, and the baseline
# schema moved to v3 so any v2 baseline elsewhere fails closed with
# `baseline_engine_mismatch` instead of reporting a fabricated 45 -> 74 jump.
#
# Measured ratchet evidence (sentrux-native 2.0.0, 2026-07-30, T3 doctor
# tree, recorded together with .sentrux/baseline.json in the same commit):
#   coupling_score 45.26 -> 45.79, quality_signal 3607 -> 3603,
#   god_file_count 32 (unchanged), cycle_count 0 (unchanged).
# Cause: T3 (#48) replaced 409 lines of legacy/check-code-intel-tools.ps1
# with a native Rust probe split across four cohesive modules
# (doctor_bootstrap/{mod,config,paths,probe}.rs) plus one integration test
# file. Import edges went 1041 -> 1076 over 230 -> 235 files.
#
# Why the movement is accepted rather than engineered away: coupling_score is
# import_lines / file_count * 10, and this tree's 45.26 average is held down by
# large PowerShell files that carry almost no import lines. Any idiomatic Rust
# module — roughly four to six `use`/`mod` lines — sits above that average, so
# adding well-factored Rust always pushes the ratio up. Reaching 45.26 here
# would have required dropping ~13 `use` lines in favour of inline fully
# qualified paths: worse code, chosen only to move a line-counting metric.
# What was NOT accepted: the first cut of this work landed the probe as one
# 1124-line file, which tripped god_file_count 32 -> 33 (quality -120). That
# is a real regression and was fixed by the module split above, not baselined.
# Prior entry (2026-07-27, security-004): 45.13 -> 45.33 coupling and
# 3968 -> 3967 quality was the cost of the shared tool_path resolver module
# (#33): one new module imported by six call sites replaces bare
# Command::new("rg"/"git") names, so the added import edges are the fix
# working as intended, not drift. God files and cycles did not move.
# Prior entry (2026-07-26): 45.07 -> 45.13 / 3969 -> 3968 was the ast-grep
# internalization conformance suite cost.
# The previous B / 70 / no-god thresholds were never green under any engine:
# the first honest self-scan of v0.5.0 already failed all three, so restoring
# them would guarantee a permanently red release gate, not protection.
#
# no_god_files stays false here because the god-file count is enforced as
# monotonic non-increase (29 -> never higher) by the no-degradation gate
# against .sentrux/baseline.json, together with quality/coupling/cycles.
#
# max_cycles stays absolute and zero: resolved Rust module import cycles are
# real defects (dag_run <-> execution_kernel and artifact_ref <-> capability
# were both removed to reach zero).

[constraints]
max_cycles = 0
max_coupling = 76.0
max_cc = 162
no_god_files = false
