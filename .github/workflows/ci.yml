name: code-intel-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running one; main pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# DR-0018: no PowerShell anywhere. Multi-line logic lives in
# .github/scripts/ci.py so every OS runs the same Python.
defaults:
  run:
    shell: bash

jobs:
  admission-policy:
    uses: ./.github/workflows/admission-policy.yml

  # The full Rust suite on Windows. (The name is a required status check.)
  # Install, packaging and the self-scan run in cross-platform-smoke, which
  # covers Windows too.
  windows-build-test-package:
    needs: admission-policy
    runs-on: windows-latest
    # Rust tests alone take ~16 min on Windows (#440).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate repository layout and Skill package
        run: |
          python tests/test_repository_layout.py -v
          python tests/test_skill_package.py -v
          python tests/test_skill_attestation.py -v

      - name: Setup Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # #404: dependency builds and the cargo registry; the key includes the
      # active rustc, so this follows Setup Rust.
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned ripgrep and ast-grep
        run: |
          python .github/scripts/ci.py install-tool rg
          python .github/scripts/ci.py install-tool ast-grep

      - name: Rust format
        run: cargo fmt -p code-intel -- --check

      - name: Rust check
        run: cargo check --locked

      - name: Rust tests and core cross-contract gate
        # Failing test names and panic lines become annotations, so the
        # failure is readable from the checks API without the raw log.
        run: |
          if ! cargo test -p code-intel --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"; then
            failures=$(grep -E -A3 '^test .* FAILED$|panicked at' "$RUNNER_TEMP/rust-tests.log" | grep -v '^\s*at \|^--$' | head -80 | awk 'BEGIN{ORS="%0A"}{gsub(/%/,"%25");gsub(/\r/,"");print}')
            echo "::error title=Rust test failures::${failures}"
            exit 1
          fi

      - name: Real ast-grep public CLI contract smokes
        run: |
          cargo test -p code-intel --locked --test capability_exec structured_edit_plan_is_scope_bound_and_preview_only -- --exact --nocapture
          cargo test -p code-intel --locked --test capability_exec ast_grep_security_scan_is_scope_bound_and_advisory_only -- --exact --nocapture

      - name: Representative project orientation benchmark
        run: cargo test -p code-intel --locked --test project_orientation_benchmark -- --nocapture

  cross-platform-smoke:
    needs: admission-policy
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    runs-on: ${{ vars.CI_5070X_ENABLED == 'true' && (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(fromJSON('["ubuntu-latest","ubuntu-24.04"]'), matrix.os) && 'ci-5070x-linux' || matrix.os }}
    timeout-minutes: 30
    env:
      SMOKE_TAG: v0.0.0-smoketest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate repository layout and Skill package
        run: |
          python tests/test_repository_layout.py -v
          python tests/test_skill_package.py -v
          python tests/test_skill_attestation.py -v

      - name: Secret pattern guard
        if: runner.os == 'Linux'
        run: python .github/scripts/ci.py secret-guard

      - name: Setup Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # #404: the key includes the job id and runner OS/arch, so each matrix
      # leg keeps its own entry.
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned ripgrep and ast-grep
        run: |
          python .github/scripts/ci.py install-tool rg
          python .github/scripts/ci.py install-tool ast-grep

      - name: Rust format
        run: cargo fmt -p code-intel -- --check

      - name: Rust check
        run: cargo check --locked

      # #404: windows-build-test-package already runs this exact suite on
      # Windows, so that leg skips it.
      - name: Rust tests and core cross-contract gate
        if: runner.os != 'Windows'
        # Failing test names and panic lines become annotations, so the
        # failure is readable from the checks API without the raw log.
        run: |
          if ! cargo test -p code-intel --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"; then
            failures=$(grep -E -A3 '^test .* FAILED$|panicked at' "$RUNNER_TEMP/rust-tests.log" | grep -v '^\s*at \|^--$' | head -80 | awk 'BEGIN{ORS="%0A"}{gsub(/%/,"%25");gsub(/\r/,"");print}')
            echo "::error title=Rust test failures::${failures}"
            exit 1
          fi

      - name: Real ast-grep public CLI contract smokes
        run: |
          cargo test -p code-intel --locked --test capability_exec structured_edit_plan_is_scope_bound_and_preview_only -- --exact --nocapture
          cargo test -p code-intel --locked --test capability_exec ast_grep_security_scan_is_scope_bound_and_advisory_only -- --exact --nocapture

      - name: Build Rust CLI
        run: cargo build -p code-intel --release --locked

      # The optional Repowise provider is exercised once, on Linux.
      - name: Real Repowise public CLI smoke (isolated)
        if: runner.os == 'Linux'
        run: |
          current="$RUNNER_TEMP/.runtime-repowise"
          recorded="$RUNNER_TEMP/.runtime-repowise-recorded"
          for pair in "$current:0.55.0" "$recorded:0.38.0"; do
            venv="${pair%%:*}" version="${pair##*:}"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --only-binary=:all: "repowise==$version"
            reported="$("$venv/bin/repowise" --version)"
            if [ "$reported" != "repowise, version $version" ]; then
              echo "::error::Repowise version mismatch: $reported"
              exit 1
            fi
          done
          "$current/bin/python" tests/test_runtime_repowise.py --cli target/release/code-intel --provider-bin "$current/bin/repowise"
          "$current/bin/python" tests/test_runtime_repowise.py --cli target/release/code-intel --provider-bin "$current/bin/repowise" --previous-provider-bin "$recorded/bin/repowise"

      - name: Real ripgrep public capability smoke
        run: cargo test -p code-intel --locked --test capability_exec inventory_rg_exec_emits_one_result_and_stable_real_rg_artifact -- --exact --nocapture

      # Release gate parity: the checkout must pass its own scan, accepted
      # only through the committed run artifacts.
      - name: Authoritative self-scan
        run: python .github/scripts/ci.py sentrux-closure --binary target/release/code-intel --repo . --work "$RUNNER_TEMP/self-scan" --final-name ci-self-scan --require-pass

      - name: Hardcoded path scan
        run: target/release/code-intel lint hardcoded-paths

      # DR-0001: the steps below package HEAD exactly as release.yml does and
      # install it through the Skill bootstrap a user runs, so the installed
      # topology (not the checkout) is what gets tested.
      - name: Package release artifact (mirrors release.yml)
        id: package
        run: python .github/scripts/ci.py package --tag "$SMOKE_TAG" --out dist

      - name: Install packaged release via the Skill bootstrap
        id: install
        run: python .github/scripts/ci.py install-package --zip "${{ steps.package.outputs.zip }}" --tag "$SMOKE_TAG" --report "$RUNNER_TEMP/bootstrap.json"

      # --require-provider-conformance fails on a present but broken provider
      # overlay; the installed topology is the only place one could appear.
      - name: Doctor
        run: code-intel doctor bootstrap --repo-path . --no-require-repowise --require-provider-conformance --json

      - name: Installed graph binary, PATH and CODE_INTEL_HOME
        run: python .github/scripts/ci.py installed-checks --report "$RUNNER_TEMP/bootstrap.json"

      # #396: the extracted release, invoked by absolute path with only git
      # and rg on PATH, must pass doctor.
      - name: Packaged doctor without Python or bin on PATH
        env:
          CODE_INTEL_SMOKE_BIN: ${{ steps.install.outputs.release_bin }}
        run: cargo test -p code-intel --locked --test install_smoke -- --ignored --nocapture

      - name: Packaged Sentrux capability closure
        run: python .github/scripts/ci.py sentrux-closure --binary "${{ steps.install.outputs.release_bin }}/code-intel" --repo "${{ steps.install.outputs.release_root }}" --work "$RUNNER_TEMP/packaged-scan" --final-name "packaged-sentrux-$GITHUB_RUN_ID" --require-pass

      - name: Scoped Repowise manifest validator tests
        run: python ./test-scoped-repowise-validator.py

      - name: Upload non-publishing release dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ steps.package.outputs.platform }}
          path: |
            dist/code-intel-pipeline-v0.0.0-smoketest-*.zip
            dist/code-intel-pipeline-v0.0.0-smoketest-*.zip.sha256
            dist/code-intel-pipeline-v0.0.0-smoketest-*.zip.release-manifest.json
          if-no-files-found: error
          retention-days: 1

  artifact-roundtrip:
    # #418: exercise release.yml's archive download contract without its
    # write token, provenance action, tag trigger, or release publication.
    needs: cross-platform-smoke
    runs-on: ${{ vars.CI_5070X_ENABLED == 'true' && (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'ci-5070x-linux' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download non-publishing release dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "release-dist-*"
          path: dist
          merge-multiple: true

      - name: Verify flat release inventory and real checksums
        run: python3 .github/scripts/ci.py verify-inventory --dir dist --tag v0.0.0-smoketest --commit "$GITHUB_SHA"
