name: code-intel-pr-gate

# Minimal viable machine risk gate for issue #95: the repo auto-merges PRs on
# green with no risk gating today. This scores every PR with our own
# `change risk` subcommand (git-only, no index, no network, no LLM — see
# crates/code-intel-cli/src/change_risk.rs) and fails the job when the
# absolute score crosses a fixed threshold, unless a human has already
# accepted the risk via label.
#
# The gate judged `risk_percentile` until issue #201. A percentile is a rank
# against a rolling sample of recent commits, which gave it two properties a
# gate must not have. It drifted: PR #195 went 82nd -> 92nd percentile on a
# score change of 67 -> 68, so what turned it red was its neighbours getting
# smaller, not the change getting riskier. And its failure rate was fixed by
# construction: ~10% of commits sit at or above the 90th percentile no matter
# how healthy the repository becomes, so the gate was a quota nobody could
# pass by improving. `change_risk/mod.rs` already treats a mechanically
# inflated percentile as a defect (see the sample-exclusion comment there);
# a moving denominator is the same defect from another source.
#
# Toolchain/action choices are mirrored from ci.yml on purpose (`rustup
# toolchain install` reading rust-toolchain.toml). ci.yml adopted the pinned
# Swatinem/rust-cache in #404; this workflow does not use it yet, so its jobs
# still build on an uncached runner.

on:
  pull_request:
    # labeled/unlabeled included so adding `risk-accepted` after a red run
    # re-evaluates the gate — otherwise a blocked PR stays blocked until the
    # next push even after a human accepts the risk.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

# One run per PR: a new push (or label change) supersedes whatever this
# gate was already computing for the same PR, so there is no reason to let
# a stale run keep burning minutes once a fresher one has started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Gate threshold for the absolute `score` (0-100). A PR at or above this
  # fails the job unless it carries the `risk-accepted` label.
  #
  # 80 is read off the measured distribution, not chosen to let anything
  # through. Scoring the last 60 non-merge commits on main one at a time
  # (`change risk <sha>^..<sha>`) gives:
  #
  #   n=60  min 11 | p50 57 | p75 66 | p80 67 | p90 68 | p95 69 | max 93
  #   top 8: 93  90  69  68  68  68  68  67
  #
  # 66-69 is a dense cluster and 69..90 is empty. Any threshold in 70..89
  # blocks exactly the same two genuine outliers (93, 90) and passes the
  # cluster, so 80 sits mid-gap with room on both sides. Inside the cluster
  # a rank is decided by ties — four merged commits scored exactly 68 —
  # which is precisely what made the percentile gate flip on noise.
  #
  # Re-derive before changing this number, and never tune it to unblock a
  # pull request in flight (#201 exit criteria).
  RISK_SCORE_BLOCK: "80"

jobs:
  admission-policy:
    uses: ./.github/workflows/admission-policy.yml

  change-risk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Build Rust CLI
        run: cargo build -p code-intel --release --locked

      - name: Run change risk
        run: |
          set -o pipefail
          ./target/release/code-intel change risk "origin/${{ github.base_ref }}..HEAD" --format json | tee risk.json

      - name: Upload risk report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: change-risk-report
          path: risk.json

      - name: Render sticky PR comment
        run: |
          MARKER="<!-- code-intel-pr-gate -->"

          if [ "$(jq -r 'has("warning")' risk.json)" = "true" ]; then
            {
              echo "$MARKER"
              echo "### Code Intel change risk"
              echo ""
              echo "_No risk score: \`$(jq -r '.warning' risk.json)\` for \`$(jq -r '.revspec' risk.json)\`._"
            } > comment-body.md
            exit 0
          fi

          SCORE=$(jq -r '.score' risk.json)
          PERCENTILE=$(jq -r '.risk_percentile' risk.json)
          LEVEL=$(jq -r '.level' risk.json)
          case "$LEVEL" in
            high) EMOJI="🔴" ;;
            medium) EMOJI="🟡" ;;
            *) EMOJI="🟢" ;;
          esac

          ASYM_TEXT="source changed, tests touched"
          if [ "$(jq -r '.signals.testAsymmetry.asymmetric' risk.json)" = "true" ]; then
            ASYM_TEXT="source changed, **no tests touched**"
          fi

          {
            echo "$MARKER"
            echo "### Code Intel change risk"
            echo ""
            echo "| Score | Percentile | Level |"
            echo "|---|---|---|"
            echo "| ${SCORE}/100 | ${PERCENTILE}th (vs last $(jq -r '.signals.sampleUsed' risk.json) commits) | ${EMOJI} ${LEVEL} |"
            echo ""
            echo "**Top signals**"
            echo "- Diff shape: $(jq -r '.signals.diff.filesTouched' risk.json) file(s), +$(jq -r '.signals.diff.insertions' risk.json)/-$(jq -r '.signals.diff.deletions' risk.json) (max file share $(jq -r '.signals.diff.maxFileShare' risk.json))"
            echo "- Test asymmetry: ${ASYM_TEXT}"
            echo "- Bug-magnet: $(jq -r '.signals.bugMagnet.totalFixCommits' risk.json) fix commit(s) in touched files (180d)"
            echo "- Churn: $(jq -r '.signals.churn.totalCommits' risk.json) commit(s) touching these files (90d)"
            echo ""
            echo "<sub>revspec: \`$(jq -r '.revspec' risk.json)\` · threshold: score >= ${RISK_SCORE_BLOCK} blocks unless labeled \`risk-accepted\`; percentile is reported, not gated (#201) · \`code-intel change risk\`</sub>"
          } > comment-body.md

      - name: Post or update sticky comment
        # Fork PRs get a read-only GITHUB_TOKEN, so posting/updating a
        # comment here would fail outright — and with GitHub Actions' default
        # `bash -e`, that failure would abort the job before it ever reaches
        # Evaluate gate below. Skip the comment on fork PRs so the actual
        # risk gate still runs; only the cosmetic comment is lost.
        if: github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          EXISTING_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- code-intel-pr-gate -->"))][0].id // empty')
          if [ -n "$EXISTING_ID" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING_ID" -X PATCH -F body=@comment-body.md
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -X POST -F body=@comment-body.md
          fi

      - name: Evaluate gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Mirror the warning check in "Render sticky PR comment": a
          # warning report (e.g. an empty diff) carries no score to gate on.
          # Handle it explicitly and exit before the comparison below, rather
          # than relying on the absent field comparing as a gate-safe value.
          if [ "$(jq -r 'has("warning")' risk.json)" = "true" ]; then
            echo "score=n/a" >> "$GITHUB_OUTPUT"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SCORE=$(jq -r '.score' risk.json)
          ACCEPTED=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            --jq '[.labels[].name] | any(. == "risk-accepted")')
          # Compared in jq, not with shell `-ge`: `score` is a JSON number and
          # `round2` can emit a fraction, which `[ ... -ge ... ]` rejects
          # outright ("integer expression expected") — and with `bash -e` that
          # would abort the job rather than block or pass, turning a gate into
          # an outage the first time a score is not whole.
          OVER=$(jq --argjson threshold "$RISK_SCORE_BLOCK" '.score >= $threshold' risk.json)
          BLOCKED="false"
          if [ "$OVER" = "true" ] && [ "$ACCEPTED" != "true" ]; then
            BLOCKED="true"
          fi
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"

      - name: Enforce gate
        if: steps.gate.outputs.blocked == 'true'
        run: |
          echo "::error::change risk score ${{ steps.gate.outputs.score }} is at or above the ${RISK_SCORE_BLOCK} threshold, and this PR does not carry the 'risk-accepted' label."
          exit 1

  agent-gate:
    # 编排 agent 推的分支(grok/**、agent/**、codex/**)必须由人点上
    # `agent-approved` label 这个检查才绿。此前「agent PR 一律开 draft」只是
    # 口头约定,合并权全靠记性;这里把它变成机制——label 是显式的人审动作,
    # 配合 branch protection 的 required check 生效。labeled/unlabeled 已在
    # 本 workflow 的触发类型里,点 label 即重跑。
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate agent label gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$HEAD_REF" in
            grok/*|agent/*|codex/*) ;;
            *)
              echo "non-agent branch ($HEAD_REF) — gate not applicable"
              exit 0
              ;;
          esac
          APPROVED=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            --jq '[.labels[].name] | any(. == "agent-approved")')
          if [ "$APPROVED" != "true" ]; then
            echo "::error::agent branch '$HEAD_REF' needs the 'agent-approved' label (human review) before merge."
            exit 1
          fi
          echo "agent-approved label present — gate green"

  sentrux-capability-gate:
    needs: admission-policy
    # The PR gate consumes only the committed Run Commit boundary.  It never
    # treats Sentrux stdout as authority: `artifact index` revalidates the
    # completion marker, content-addressed manifest, and every Artifact Ref.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Install pinned ripgrep
        shell: bash
        run: python .github/scripts/ci.py install-tool rg

      - name: Build Rust CLI
        shell: bash
        run: cargo build -p code-intel --release --locked

      # Issue #386: the compiled CLI is the only producer of the Quality
      # Signal projection; this job only invokes it and renders the output.
      - name: Run authoritative Sentrux capability pipeline
        shell: bash
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          work="$RUNNER_TEMP/code-intel-pr-sentrux"
          final="pr-sentrux-$GITHUB_RUN_ID"
          python .github/scripts/ci.py sentrux-closure --binary target/release/code-intel --repo . --work "$work" --final-name "$final"
          target/release/code-intel quality-projection build --artifact-root "$work/authority" \
            --repo "$(basename "$PWD")" --repo-path . --commit "$GITHUB_SHA" --base-ref "origin/$PR_BASE_REF" \
            --out "$RUNNER_TEMP/quality-signal-projection.json" --orca-run-id "$GITHUB_RUN_ID" --pr "$PR_NUMBER"

      - name: Upload Sentrux closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentrux-pr-closure
          path: |
            ${{ runner.temp }}/code-intel-pr-sentrux/authority
          if-no-files-found: ignore

      - name: Upload Quality Signal projection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-signal-projection
          path: ${{ runner.temp }}/quality-signal-projection.json
          if-no-files-found: ignore

      - name: Render Quality Signal PR Check summary
        shell: bash
        run: python .github/scripts/ci.py quality-summary --projection "$RUNNER_TEMP/quality-signal-projection.json" --comment "$RUNNER_TEMP/quality-comment-body.md"

      - name: Post or update Quality Signal sticky comment
        # Fork PRs get a read-only GITHUB_TOKEN; skip the comment, keep the
        # gate (job summary + annotations above already ran regardless).
        if: github.event.pull_request.head.repo.fork == false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$RUNNER_TEMP/quality-comment-body.md"
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- code-intel-quality-signal -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F "body=@$body"
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -X POST -F "body=@$body"
          fi
