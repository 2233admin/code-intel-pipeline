[package]
name = "code-intel"
version = "0.7.2-beta.7"
edition = "2021"
description = "Local Code Intel Pipeline CLI for artifact resume and contract checks"
license = "MIT"
repository = "https://github.com/2233admin/code-intel-pipeline"

[dependencies]
pep440_rs = "0.7.3"
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
tiny_http = "0.12.0"
url = "2.5.8"

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
