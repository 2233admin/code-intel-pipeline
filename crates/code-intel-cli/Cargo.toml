[package]
name = "code-intel"
version = "0.7.1"
edition = "2021"
description = "Local Code Intel Pipeline CLI for artifact resume and contract checks"
license = "MIT"
repository = "https://github.com/2233admin/code-intel-pipeline"

[dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.9", features = ["json"] }
tiny_http = "0.12"
